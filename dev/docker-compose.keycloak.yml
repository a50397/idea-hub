services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ideahub-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import
