services:
  mongodb:
    image: mongo:7.0.39
    container_name: ideahub-mongodb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # A replica set with auth needs a keyFile for internal member authentication.
    # This wrapper (running as root, before the official entrypoint drops to the
    # mongodb user) generates the keyFile once into a named volume, locks it down,
    # then hands off to docker-entrypoint.sh which creates the root user on a fresh
    # data volume from MONGO_INITDB_ROOT_*.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        KEYFILE=/etc/mongo-keyfile/keyfile
        if [ ! -s "$$KEYFILE" ]; then
          openssl rand -base64 756 > "$$KEYFILE"
        fi
        chmod 400 "$$KEYFILE"
        chown mongodb:mongodb "$$KEYFILE"
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile "$$KEYFILE" --bind_ip_all
    environment:
      MONGO_INITDB_DATABASE: ideahub
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example-dev-password}
    expose:
      - '27017'
    ports:
      # localhost-only publish so a host-run backend (VS Code debug) can reach Mongo
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/etc/mongo-keyfile
    networks:
      - ideahub-network
    healthcheck:
      # Authenticated ping that also initiates the single-node replica set on first
      # boot. Uses the root credentials from the environment above.
      test: |
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fokips/ideahub-backend:1.1.0
    container_name: ideahub-backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: "mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-example-dev-password}@mongodb:27017/ideahub?replicaSet=rs0&authSource=admin"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 3001
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Mail (best-effort outbound email, disabled by default). No :? fail-fast
      # guards — mail is optional-by-design; the backend boot guard owns the
      # enabled-but-misconfigured case. For local capture, start the mailpit
      # profile and set MAIL_ENABLED=true / SMTP_HOST=mailpit / SMTP_PORT=1025.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: "${MAIL_FROM:-IdeaHub <no-reply@ideahub.local>}"
    expose:
      - '3001'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ideahub-network
    command: sh -c "npx prisma db push && npm start"

  # Mailpit: local SMTP sink + web UI for exercising the mail path in dev.
  # Opt-in only via the "mail" profile so it never starts for a normal `up`:
  #   docker compose --profile mail up -d mailpit
  # Then point the backend at it (MAIL_ENABLED=true, SMTP_HOST=mailpit for an
  # in-compose backend or localhost for a host-run one, SMTP_PORT=1025) and read
  # captured mail at http://localhost:8025. See dev/MAIL-TESTING.md. Dev-only;
  # not present in docker-compose.prod.yml.
  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: ideahub-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # localhost-only publish (matches mongodb / dev Keycloak) so the sink and
      # its open web UI are never exposed to the LAN.
      - '127.0.0.1:1025:1025'   # SMTP
      - '127.0.0.1:8025:8025'   # web UI
    networks:
      - ideahub-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: fokips/ideahub-frontend:1.1.0
    container_name: ideahub-frontend
    restart: unless-stopped
    ports:
      # host:container — the non-root nginx listens on 8080 inside the container.
      - '80:8080'
    depends_on:
      - backend
    networks:
      - ideahub-network

networks:
  ideahub-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_keyfile:
    driver: local
