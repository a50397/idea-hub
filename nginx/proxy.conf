# IdeaHub reverse proxy — the single host entry point in front of the SPA
# (frontend:8080) and the API (backend:3001). Runs on nginx-unprivileged, so it
# binds unprivileged in-container ports: 8080 (HTTP) and, once TLS is enabled,
# 8443 (HTTPS); docker-compose maps host 80/443 onto them.
#
# TLS is PREPARED but not active: the HTTPS server block below ships commented
# with a certificate slot at ./nginx/certs (mounted read-only at
# /etc/nginx/certs). Activation steps are listed above that block.

server {
    listen 8080;
    server_name _;

    # SPA + static assets from the frontend container. Its own nginx adds the
    # security headers / CSP and does the Vue Router fallback — this proxy
    # deliberately adds none, so headers are defined in exactly one place.
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API straight to the backend (one hop; mirrors frontend/nginx.conf, which
    # keeps its own /api proxy for the no-front-proxy layout). Exactly one
    # proxy sits before the backend either way, matching its `trust proxy` = 1.
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

