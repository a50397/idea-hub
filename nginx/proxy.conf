#      must NEVER be committed):
#        ideahub.crt   server certificate incl. intermediate/CA chain
#        ideahub.key   private key (chmod 600)
#   2) Uncomment the entire server block below.
#   3) Uncomment the '443:8443' port mapping in docker-compose.yml /
#      docker-compose.prod.yml.
#   4) Set COOKIE_SECURE=true for the backend (session cookie HTTPS-only;
#      the app already sets `trust proxy` = 1 and honours X-Forwarded-Proto).
#   5) Optionally make the HTTP block above redirect:
#        return 301 https://$host$request_uri;
