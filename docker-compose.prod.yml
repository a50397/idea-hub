name: ideahub

services:
  mongodb:
    image: mongo:7.0.39
    container_name: ideahub-mongodb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # A replica set with auth needs a keyFile for internal member authentication.
    # This wrapper (running as root, before the official entrypoint drops to the
    # mongodb user) generates the keyFile once into a named volume, locks it down,
    # then hands off to docker-entrypoint.sh which creates the root user on a fresh
    # data volume from MONGO_INITDB_ROOT_*.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        KEYFILE=/etc/mongo-keyfile/keyfile
        if [ ! -s "$$KEYFILE" ]; then
          openssl rand -base64 756 > "$$KEYFILE"
        fi
        chmod 400 "$$KEYFILE"
        chown mongodb:mongodb "$$KEYFILE"
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile "$$KEYFILE" --bind_ip_all
    environment:
      MONGO_INITDB_DATABASE: ideahub
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
    expose:
      - '27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/etc/mongo-keyfile
    networks:
      - ideahub-network
    healthcheck:
      # Authenticated ping that also initiates the single-node replica set on first
      # boot. Uses the root credentials from the environment above.
      test: |
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  backend:
    image: fokips/ideahub-backend:1.2.3
    container_name: ideahub-backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: "mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/ideahub?replicaSet=rs0&authSource=admin"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # COOKIE_SECURE=true makes the session cookie HTTPS-only. It is safe ONLY when
      # an upstream TLS terminator (reverse proxy / load balancer) sits in front and
      # forwards X-Forwarded-Proto; the app already sets `trust proxy` = 1, so review
      # that the terminator is trusted and sets the header before enabling this.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Mail is ADMIN-MANAGED at runtime (the Email settings page) and stored in the
      # database — there are no SMTP_* / MAIL_* env vars. MAIL_SETTINGS_KEY encrypts
      # the stored SMTP password (AES-256-GCM) and is REQUIRED in production: the
      # backend fails fast at boot if it is missing, and rotating/losing it makes any
      # previously saved password undecryptable (the admin re-enters it). Generate:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      MAIL_SETTINGS_KEY: ${MAIL_SETTINGS_KEY:?MAIL_SETTINGS_KEY must be set}
      # SSO / OIDC — compose only injects variables listed here, so every SSO_*
      # var must be passed through explicitly or the backend never sees it.
      # All optional: SSO_ENABLED absent/false keeps password-only login, and
      # empty strings fall back to the in-app defaults.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_POST_LOGOUT_REDIRECT_URI: ${SSO_POST_LOGOUT_REDIRECT_URI:-}
      SSO_SCOPE: ${SSO_SCOPE:-}
      SSO_ROLES_CLAIM: ${SSO_ROLES_CLAIM:-}
      SSO_ORG_CLAIM: ${SSO_ORG_CLAIM:-}
      SSO_EMAIL_CLAIM: ${SSO_EMAIL_CLAIM:-}
      SSO_NAME_CLAIM: ${SSO_NAME_CLAIM:-}
      SSO_ROLE_MAP: ${SSO_ROLE_MAP:-}
      SSO_SHOW_LOGOUT: ${SSO_SHOW_LOGOUT:-false}
      BREAK_GLASS_EMAILS: ${BREAK_GLASS_EMAILS:-}
      # Corporate-CA trust for OUTBOUND HTTPS (OIDC discovery/token/userinfo).
      # Node does NOT use the OS trust store — an internally-issued IdP
      # certificate needs the corporate CA chain (PEM) mounted and this var set
      # (uncomment here AND the volumes below). Never "fix" this with
      # NODE_TLS_REJECT_UNAUTHORIZED=0 — that disables all TLS verification.
      # NODE_EXTRA_CA_CERTS: /etc/ssl/corp/corp-ca.pem
    expose:
      - "3001"
    # volumes:
    #   - ./ca/corp-ca.pem:/etc/ssl/corp/corp-ca.pem:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ideahub-network
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: fokips/ideahub-frontend:1.2.3
    container_name: ideahub-frontend
    restart: unless-stopped
    expose:
      # Internal only — the nginx reverse proxy below is the host entry point.
      - '8080'
    depends_on:
      - backend
    networks:
      - ideahub-network

  # Reverse proxy — the single host entry point in front of the SPA and the API.
  # TLS-READY: HTTP-only today; nginx/proxy.conf ships a fully written HTTPS
  # server block commented out, with a certificate slot at ./nginx/certs
  # (gitignored). When the certificate arrives: drop ideahub.crt + ideahub.key
  # into nginx/certs/, uncomment the HTTPS block there, uncomment '443:8443'
  # below and set COOKIE_SECURE=true — full steps in nginx/proxy.conf.
  # NOTE: the deploy host needs the nginx/ directory next to this compose file
  # (it is bind-mounted below).
  nginx:
    image: nginxinc/nginx-unprivileged:1.25.5-alpine
    container_name: ideahub-nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # host:container — non-root nginx binds unprivileged in-container ports.
      - '80:8080'
      # HTTPS — uncomment once the certificate is installed (see nginx/proxy.conf):
      # - '443:8443'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificate slot (read-only mount; directory is gitignored except .gitkeep).
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ideahub-network

networks:
  ideahub-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_keyfile:
    driver: local
