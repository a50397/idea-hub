name: ideahub

services:
  mongodb:
    image: mongo:7.0.39
    container_name: ideahub-mongodb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # A replica set with auth needs a keyFile for internal member authentication.
    # This wrapper (running as root, before the official entrypoint drops to the
    # mongodb user) generates the keyFile once into a named volume, locks it down,
    # then hands off to docker-entrypoint.sh which creates the root user on a fresh
    # data volume from MONGO_INITDB_ROOT_*.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        KEYFILE=/etc/mongo-keyfile/keyfile
        if [ ! -s "$$KEYFILE" ]; then
          openssl rand -base64 756 > "$$KEYFILE"
        fi
        chmod 400 "$$KEYFILE"
        chown mongodb:mongodb "$$KEYFILE"
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile "$$KEYFILE" --bind_ip_all
    environment:
      MONGO_INITDB_DATABASE: ideahub
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
    expose:
      - '27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/etc/mongo-keyfile
    networks:
      - ideahub-network
    healthcheck:
      # Authenticated ping that also initiates the single-node replica set on first
      # boot. Uses the root credentials from the environment above.
      test: |
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  backend:
    image: fokips/ideahub-backend:1.1.0
    container_name: ideahub-backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: "mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/ideahub?replicaSet=rs0&authSource=admin"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # COOKIE_SECURE=true makes the session cookie HTTPS-only. It is safe ONLY when
      # an upstream TLS terminator (reverse proxy / load balancer) sits in front and
      # forwards X-Forwarded-Proto; the app already sets `trust proxy` = 1, so review
      # that the terminator is trusted and sets the header before enabling this.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ideahub-network
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: fokips/ideahub-frontend:1.1.0
    container_name: ideahub-frontend
    restart: unless-stopped
    ports:
      # host:container — the non-root nginx listens on 8080 inside the container.
      - '80:8080'
    depends_on:
      - backend
    networks:
      - ideahub-network

networks:
  ideahub-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_keyfile:
    driver: local
